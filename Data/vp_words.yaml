# goethe/words
- Id: Bescheid wissen
  Usage: 'über `A`: about'
  Meaning: to know
  Wiki: to know
  Examples:
    - Ich möchte darüber Bescheid wissen, wenn jemand nicht teilnimmt.
    - Es tut mir leid, aber ich habe darüber nicht Bescheid gewusst.

- Id: anmerken
  Form: merkt an, merkte an, hat angemerkt
  Usage: 'zu `D`: on/about/of'
  Meaning: to remark, to make a note
  Cambridge: to remark; to make a note of
  Wiki: to mark; to note; to make a note of (something); to observe (something) in (someone); to notice (something) about (someone)
  Examples:
    - Ich möchte noch etwas zu diesem Punkt anmerken.
    - Ich würde dazu gern noch etwas anmerken.

- Id: basieren
  Form: basiert, basierte, hat basiert
  Usage: 'auf `D`: on'
  Meaning: to base, to be based
  Wiki: to base (on); to be based (on)
  Examples:
    - Der Film basiert auf einer wahren Geschichte.

- Id: beauftragen
  Form: beauftragt, beauftragte, hat beauftragt
  Usage: 'mit `D`: with'
  Meaning: to mandate, to order from, to hire for a particular business
  Cambridge: to commission, to engage, to hire
  Wiki: to mandate, to order from, to hire for a particular business
  Examples:
    - Wir haben diese Firma mit dem Umbau des Hauses beauftragt.
    - Sie haben uns damit beauftragt, für die Getränke zu sorgen.

- Id: beglückwünschen
  Form: beglückwünscht, beglückwünschte, hat beglückwünscht
  Usage: 'zu `D`: on/about'
  Meaning: to congratulate
  Cambridge: to congratulate; to congratulate yourself
  Wiki: to congratulate
  Examples:
    - Er hat ihn zu seinem Erfolg beglückwünscht.

- Id: beitragen
  Form: trägt bei, trug bei, hat beigetragen
  Usage: 'zu `D`: to'
  Meaning: to contribute
  Cambridge: to contribute
  Wiki: to contribute to
  Examples:
    - Alle haben zu diesem großen Erfolg beigetragen.
    - Wir alle müssen dazu beitragen, dass dieses Projekt ein Erfolg wird.

- Id: sich beziehen
  Form: bezieht sich, bezog sich, hat sich bezogen
  Usage: 'auf `A`: to'
  Meaning: to refer, to relate
  Cambridge: to get, to receive; to move into; to cover
  Wiki: to refer, relate to; (Senses related to covering.); to put a sheet or cover on (a mattress, duvet etc.); to upholster (a piece of furniture); to become overcast; (Senses related to settling in a place.); to move into (a dwelling); to take up (a position); to take (a position, stand); (Senses related to obtaining.); to draw, receive (a regular payment such as a pension or benefit); to buy something regularly from the same provider; to have a subscription to/for
  Examples:
    - Ich beziehe mich auf Ihren Brief vom 19. April.
    - Ich beziehe mich auf das, was Sie vorhin erwähnt haben.
    - Meine Frage bezieht sich auf die Garantiebestimmungen.

- Id: demonstrieren
  Form: demonstriert, demonstrierte, hat demonstriert
  Usage: 'für `A`: for; gegen `A`: against'
  Meaning: to demonstrate
  Cambridge: to demonstrate
  Wiki: to demonstrate
  Examples:
    - Die Leute auf der Straße demonstrieren für die Einhaltung der Menschenrechte.
    - Viele Menschen sind auf die Straße gegangen, um gegen diese Politik zu demonstrieren.

- Id: sich orientieren
  Form: orientiert sich, orientierte sich, hat sich orientiert
  Usage: 'an `D`: with help of'
  Meaning: to orient oneself
  Cambridge: to get one’s bearings; to be based/oriented
  Wiki: to orient oneself; to orientate oneself
  Examples:
    - Bea orientiert sich in allem an ihrer
      Schwester.
    - In einer fremden Stadt kann man sich am Stadtplan
      orientieren.
    - Vielen Jugendlichen fehlt jemand, an dem sie sich
      orientieren könnten.
    - Orientiert euch an dem, was in der Anleitung steht.

- Id: sich spezialisieren
  Form: spezialisiert, spezialisierte, hat spezialisiert
  Usage: 'auf `A`: in'
  Meaning: to specialize
  Wiki: to specialize
  Examples:
    - Sie haben sich darauf spezialisiert, defekte Handys zu
      reparieren.

- Id: verteidigen
  Form: verteidigt, verteidigte, hat verteidigt
  Usage: gegen `A`
  Meaning: to defend (from attack)
  Cambridge: to defend
  Wiki: to defend (from attack); to justify (an opinion, behavior, etc.)

- Id: wehren
  Form: wehrt sich, wehrte sich, hat sich gewehrt
  Usage: gegen `A`
  Meaning: to fight
  Cambridge: to defend yourself, to fight back
  Wiki: to fight; to defend

- Id: werben
  Form: wirbt, warb, hat geworben
  Usage: für `A`; um `A`
  Meaning: to recruit; to enlist
  Cambridge: to recruit, to attract
  Wiki: to recruit; to enlist; to promote, advertise; to attract, to woo

- Id: wundern
  Form: wundert, wunderte, hat gewundert
  Usage: über `A`
  Meaning: to wonder
  Cambridge: to be surprised; to surprise
  Wiki: to surprise; to be surprised; to wonder

- Id: zugucken
  Form: guckt zu, guckte zu, hat zugeguckt
  Usage: jdmd. zugucken bei `D`
  Meaning: to watch (orally)
  Examples:
    - Sie hat mir beim Arbeiten zugeguckt.
    - Du kannst mir dabei zugucken, wie ich es mache.

- Id: zusammenstoßen
  Form: stößt zusammen, stieß zusammen, ist zusammengestoßen
  Usage: mit `D`
  Meaning: to collide
  Cambridge: to collide
  Wiki: to collide

- Id: zusehen
  Form: sieht zu, sah zu, hat zugesehen
  Usage: bei `D`
  Meaning: to watch
  Cambridge: to watch; to see to it, to make sure
  Wiki: to watch; to watch out, to take care; to make sure, to see to it (that something happens)

- Id: ärgern
  Form: ärgert, ärgerte, hat geärgert
  Usage: über `A`
  Meaning: to annoy, to be annoyed
  Cambridge: to annoy, to make angry
  Wiki: to annoy, to make angry (+accusative); to be annoyed, to be angry, to get annoyed, to get angry

- Id: überzeugen
  Form: überzeugt, überzeugte, hat überzeugt
  Usage: von `D`
  Meaning: to convince
  Cambridge: to convince, to persuade; to impress; to satisfy yourself
  Wiki: to convince; to convince oneself
